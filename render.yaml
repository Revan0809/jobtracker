databases:
  - name: jobtracker-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: jobtracker-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtracker-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: "https://jobtracker-nu-black.vercel.app"
      # Render's default Python (3.14 as of writing) has no prebuilt wheel for
      # pydantic-core 2.27.2, which then fails to build from source in Render's
      # read-only sandbox. backend/runtime.txt pins 3.12 but wasn't honored when
      # the service was created via the API with a custom rootDir, so it's
      # pinned here too as a second, confirmed-working source of truth.
      - key: PYTHON_VERSION
        value: "3.12.7"
